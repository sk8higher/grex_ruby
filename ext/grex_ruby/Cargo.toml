[package]
name = "grex_ruby"
version = "0.2.0"
edition = "2021"
authors = ["Nelly Simkova <sk8high3r@ya.ru>"]
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
magnus = { version = "0.9" }
rb-sys = { version = "0.9", features = ["stable-api-compiled-fallback"] }
