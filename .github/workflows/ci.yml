name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - uses: dtolnay/rust-toolchain@stable

      - name: Install libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      - name: Run tests
        run: bundle exec rake
